<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Product Store</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Product Store</a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="products.html">Products</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="about.html">About</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="contact.html">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Alert -->
    <div class="container mt-4">
        <div class="alert alert-info text-center animate__animated animate__fadeInDown">
            Have a question? Send us a message using the form below.
        </div>
    </div>

    <!-- Contact Form -->
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">

                <div class="card shadow animate__animated animate__fadeInUp">
                    <div class="card-header bg-primary text-white">
                        <h3 class="mb-0">Contact Us</h3>
                    </div>

                    <div class="card-body">

                        <form>

                            <div class="mb-3">
                                <label for="name" class="form-label">
                                    Full Name
                                </label>
                                <input type="text"
                                       class="form-control"
                                       id="name"
                                       placeholder="Enter your full name">
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">
                                    Email Address
                                </label>
                                <input type="email"
                                       class="form-control"
                                       id="email"
                                       placeholder="Enter your email">
                            </div>

                            <div class="mb-3">
                                <label for="subject" class="form-label">
                                    Subject
                                </label>
                                <input type="text"
                                       class="form-control"
                                       id="subject"
                                       placeholder="Enter the subject">
                            </div>

                            <div class="mb-3">
                                <label for="message" class="form-label">
                                    Message
                                </label>
                                <textarea class="form-control"
                                          id="message"
                                          rows="5"
                                          placeholder="Write your message here"></textarea>
                            </div>

                            <div class="d-grid">
                                <button type="submit"
                                        class="btn btn-primary">
                                    Send Message
                                </button>
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0">
            © 2026 Product Store | All Rights Reserved
        </p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
